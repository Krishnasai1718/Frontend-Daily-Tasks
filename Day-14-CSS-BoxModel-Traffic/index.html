<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #outer {
        border: 3px solid black;
        padding: 40px 100px;
        width: 200px;
        border-radius: 20px;
        text-align: center;
      }
      #main {
        height: 550;
        width: 150;
        background-color: black;
        padding-top: 15px;
        border-radius: 15px;
      }
      #red {
        background-color: red;
        height: 150px;
        width: 150px;
        border: 2px solid white;
        border-radius: 50%;
        margin: 20px auto;
        text-align: center;
        font-weight: bold;
        box-sizing: border-box;
        padding-top: 30px;
        margin-bottom: 0px;
      }
      #yellow {
        background-color: yellow;
        height: 150px;
        width: 150px;
        border: 2px solid white;
        border-radius: 50%;
        margin: 20px auto;
        text-align: center;
        font-weight: bold;
        box-sizing: border-box;
        padding-top: 30px;
        margin-bottom: 0px;
      }
      #green {
        background-color: green;
        height: 150px;
        width: 150px;
        border: 2px solid white;
        border-radius: 50%;
        margin: 20px auto;
        text-align: center;
        font-weight: bold;
        box-sizing: border-box;
        padding-top: 30px;
        margin-bottom: 0px;
      }
      #poll {
        height: 100px;
        width: 20px;
        background-color: black;
        margin: 0px auto;
        padding: 0px;
      }
      #movie {
        height: 750px;
        width: 450px;
        border-radius: 20px;
        border: 4px solid black;
        text-align: center;
      }
      img {
        height: 600px;
        width: 450px;
        border-radius: 17px;
      }
    </style>
  </head>
  <body>
    <h1>CSS Box model Task.</h1>
    <div id="outer">
      <div id="main">
        <div id="red">STOP PROCRASTINAT</div>
        <div id="yellow">GET READY TO LEARN</div>
        <div id="green">START YOUR JOURNEY</div>
      </div>
      <div id="poll"></div>
      <p><b>FULLSTACK EXPERTS ACADEMY</b></p>
      <p>Learn &bull; Build &bull; Grow 🚀</p>
    </div>
    <br /><br /><br />
    <div id="movie">
      <div id="rating">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoow0KLMRTyVM6m2epPOzbCAMuxqA1nZz9tRy1lIoXjA&s=10"
          alt="House of the Dragon"
        />
      </div>
      <h2>House Of The Dragon</h2>
      <p>
        Rating :5/5 <br />
        ⭐⭐⭐⭐⭐
      </p>
    </div>
  </body>
</html>
