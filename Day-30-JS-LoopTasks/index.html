<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Tasks</title>
</head>

<body>
    <h1>Sum 10 to a num:</h1>
    <label>Enter a num :</label>
    <input type="text" id="sumInput"><br>
    <label>Result:</label>
    <input type="text" id="sumResult">
    <button onclick="sumtwo()">Result</button>
    <br><br>
    <h1>Sum of N natural numbers:</h1>
    <label>Enter a num1 :</label>
    <input type="text" id="naturalInput"><br>
    <label>Result :</label>
    <input type="text" id="naturalResult">
    <button onclick="natural()">Result</button>
    <br><br>
    <h1>Enter Tables:</h1>
    <label>Enter num:</label>
    <input type="text" id="table"><br>
    <label>Result :</label>
    <textarea id="tableResult"></textarea>
    <button onclick="table()">Result</button>
    <br><br>
    <h1>Factorial Number</h1>
    <label>Enter a num:</label>
    <input type="text" id="fact"><br>
    <label>Result :</label>
    <input type="text" id="factorialResult">
    <button onclick="factor()">Result</button>
    <br><br>
    <h1>Fibonacci Number</h1>
    <label>Enter a num:</label>
    <input type="text" id="fib1"><br>
    <label>Result :</label>
    <textarea id="fibonacciResult"></textarea>
    <button onclick="fibonacci()">Result</button>

    <script>
        function sumtwo() {
            let n1 = parseInt(document.getElementById("sumInput").value);
            let result = 0;
            for (let i = 1; i <= n1; i += 1) {
                result = result + 10;
            }
            document.getElementById("sumResult").value = result;
        }

        function natural() {
            let n2 = parseInt(document.getElementById("naturalInput").value);
            let sum = 0;
            for (let i = 1; i <= n2; i += 1) {
                sum = sum + i;
            }
            document.getElementById("naturalResult").value = sum;
        }

        function table() {
            let table = parseInt(document.getElementById("table").value);
            let result = "";
            for (let i = 1; i <= 10; i++) {
                result = result + table + "X" + i + "=" + table * i + "\n";
            }
            document.getElementById("tableResult").value = result;
        }

        function factor() {
            let n4 = parseInt(document.getElementById("fact").value);
            let result1 = 1;
            for (let i = n4; i >= 1; i = i - 1) {
                result1 = result1 * i;
            }
            document.getElementById("factorialResult").value = result1;
        }

        function fibonacci() {
            let n = parseInt(document.getElementById("fib1").value);
            let a =0;
            let b =1;
            let result = "";
            for (let i = 1; i <= n; i += 1) {
                result = result + a + " ";
                let c = a + b;
                a = b;
                b = c;
            }
            document.getElementById("fibonacciResult").value = result;
        }
    </script>
</body>

</html>
