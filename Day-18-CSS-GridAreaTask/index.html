<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            width: 90vw;
            grid-template-columns: repeat(8,1fr);
            grid-template-rows: 100px 480px 100px;
            margin: 20px;
            gap: 20px;
            grid-template-areas: "header header header header header header header header"
                                 "rightside rightside main main main main leftside leftside"
                                 "footer footer footer footer footer footer footer footer";
        }
        .header{
            background-color: #ffbe0b;
            grid-area: header;
        }
        .rightside{
            background-color: #fb5607;
            grid-area: rightside;
        }
        .main{
            background-color: #ff006e;
            grid-area: main;
        }
        .leftside{
            background-color: #8338ec;
            grid-area: leftside;
        }
        .footer{
            background-color: #3a86ff;
            grid-area: footer;
        }
        .box{
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-family: cursive;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header box">Header</div>
        <div class="leftside box">Right Sidebar</div>
        <div class="main box">Main Section</div>
        <div class="rightside box">Left Sidebar</div>
        <div class="footer box">Footer</div>
    </div>
</body>
</html>
