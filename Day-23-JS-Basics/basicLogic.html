<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Logic Programs</title>
</head>

<body>

    <h1>Adding Two Numbers</h1>

    <label>Enter number 1 :</label>
    <input type="text" placeholder="Enter num1" id="addNum1"><br>

    <label>Enter number 2 :</label>
    <input type="text" placeholder="Enter num2" id="addNum2"><br>

    <label>Result :</label>
    <input type="text" id="addResult" placeholder="Result"><br>

    <button onclick="addTwo()">Add</button>

    <hr>

    <h1>Average of 3 Numbers</h1>

    <label>Enter number 1 :</label>
    <input type="text" placeholder="Enter num1" id="avgNum1"><br>

    <label>Enter number 2 :</label>
    <input type="text" placeholder="Enter num2" id="avgNum2"><br>

    <label>Enter number 3 :</label>
    <input type="text" placeholder="Enter num3" id="avgNum3"><br>

    <label>Result :</label>
    <input type="text" placeholder="Result" id="avgResult"><br>

    <button onclick="averageThree()">Average</button>

    <hr>


    <h1>Sum of First N Natural Numbers</h1>

    <label>Enter the N value :</label>
    <input type="text" placeholder="Enter the N value" id="sumN"><br>

    <label>Result :</label>
    <input type="text" placeholder="Result" id="sumResult"><br>

    <button onclick="addNnumbers()">Submit</button>

    <hr>

    <h1>Average of First N Natural Numbers</h1>

    <label>Enter the N value :</label>
    <input type="text" placeholder="Enter the N value" id="avgN"><br>

    <label>Result :</label>
    <input type="text" placeholder="Result" id="avgNResult"><br>

    <button onclick="avgNnumbers()">Average</button>

    <hr>


    <h1>Finding Missing Angle in Triangle</h1>

    <label>Enter angle 1 :</label>
    <input type="text" placeholder="Enter angle 1" id="angle1"><br>

    <label>Enter angle 2 :</label>
    <input type="text" placeholder="Enter angle 2" id="angle2"><br>

    <label>Third angle :</label>
    <input type="text" placeholder="Result" id="angleResult"><br>

    <button onclick="angle()">Submit</button>

    <hr>

    <h1>Finding Simple Interest</h1>

    <label>Enter principal amount :</label>
    <input type="text" placeholder="Enter principal amount" id="principal"><br>

    <label>Enter time :</label>
    <input type="text" placeholder="Enter time" id="time"><br>

    <label>Enter interest rate :</label>
    <input type="text" placeholder="Enter interest rate" id="rate"><br>

    <label>Result :</label>
    <input type="text" placeholder="Result" id="interestResult"><br>

    <button onclick="simpleIntrest()">Submit</button>


    <script type="text/javascript" src="basicLogic.js"></script>

</body>
</html>
