<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
         * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        border: 10px solid #111111;
        width: 1200px;
        height: 500px;
        gap: 50px;
        background-color: #b8d87c;
      }
      .card1 {
        height: 300px;
        width: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        transition: 2s;
        transform-style: preserve-3d;
      }
      .front1 {
        position: absolute;
        height: 100%;
        width: 100%;
        backface-visibility: hidden;
        font-size: 25px;
        background-color: rgb(197, 75, 30);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateX(0deg);
        border-radius: 10px;
      }
      .back1 {
        position: absolute;
        height: 100%;
        width: 100%;
        backface-visibility: hidden;
        font-size: 25px;
        background-color: rgb(18, 218, 151);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateX(180deg);
        border-radius: 10px;
      }
      .card1:hover {
        transform: rotateX(180deg);
      }
      .card2 {
        height: 300px;
        width: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        transition: 2s;
        transform-style: preserve-3d;
      }
      .front2 {
        position: absolute;
        height: 100%;
        width: 100%;
        backface-visibility: hidden;
        font-size: 25px;
        background-color: rgb(76, 96, 208);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateY(0deg);
        border-radius: 10px;
      }
      .back2 {
        position: relative;
        height: 100%;
        width: 100%;
        backface-visibility: hidden;
        font-size: 25px;
        background-color: orange;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform-style: preserve-3d;
        transform: rotateY(180deg);
        border-radius: 10px;
      }
      .card2:hover {
        transform: rotateY(180deg);
      }
      .card3 {
        position: relative;
        height: 300px;
        width: 200px;
        transform-style: preserve-3d;
        animation: card3 4s infinite;
        margin: 10px;
      }
      .front3,
      .back3,
      .front4,
      .back4 {
        position: absolute;
        height: 100%;
        width: 100%;
        backface-visibility: hidden;
        font-size: 25px;
      }
      .front3 {
        background-color: rgb(245, 16, 123);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateX(0deg);
        border-radius: 10px;
      }
      .back3 {
        background-color: rgb(198, 32, 198);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateX(180deg);
        border-radius: 10px;
      }
      @keyframes card3 {
        0% {
          transform: rotateX(0deg);
        }

        40% {
          transform: rotateX(0deg);
        }

        50% {
          transform: rotateX(180deg);
        }

        90% {
          transform: rotateX(180deg);
        }

        100% {
          transform: rotateX(360deg);
        }
      }
      .card4 {
        position: relative;
        height: 300px;
        width: 200px;
        transform-style: preserve-3d;
        animation: card4 ease 4s infinite;
        margin: 10px;
      }
      .front4 {
        background-color: rgba(0, 128, 11, 0.87);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateY(0deg);
        border-radius: 10px;
      }
      .back4 {
        background-color: rgb(44, 22, 218);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        transform: rotateY(180deg);
        border-radius: 10px;
      }
      @keyframes card4 {
        0% {
          transform: rotateY(0deg);
        }

        40% {
          transform: rotateY(0deg);
        }

        50% {
          transform: rotateY(180deg);
        }

        90% {
          transform: rotateY(180deg);
        }

        100% {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card1">
        <div class="front1">Front</div>
        <div class="back1">Back</div>
      </div>
      <div class="card2">
        <div class="front2">Front</div>
        <div class="back2">Back</div>
      </div>
      <div class="card3">
        <div class="front3">Front</div>
        <div class="back3">Back</div>
      </div>
      <div class="card4">
        <div class="front4">Front</div>
        <div class="back4">Back</div>
      </div>
    </div>
  </body>
</html>
