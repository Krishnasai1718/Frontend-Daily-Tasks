<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            border: 10px solid rgb(56, 56, 251);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color:rgb(195, 195, 222);
;
        }
        .outline{
            height: 400px;
            width: 400px;
            border-radius: 50%;
            border: 10px solid rgb(247, 9, 9);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #ddb8b0;
        }
        #main{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            border: 10px solid rgb(7, 134, 7);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #9febab;
        }
        #one{
            font-family:cursive;
            font-size: 25px;
            font-weight:900;
            color:rgb(10, 10, 28);
            text-shadow: 3px 3px 3px #2a05ff;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="outline">
            <div id="main">
                <p id="one">Fullstack<br>Developer</p>
            </div>
        </div>
    </div>
</body>
</html>
